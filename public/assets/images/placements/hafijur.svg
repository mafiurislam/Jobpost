  </g>

  <!-- Watermark Text Overlay -->
  <text x="150" y="240" font-family="sans-serif" font-weight="bold" font-size="11" fill="#4a5568" opacity="0.7" text-anchor="middle">Advine 360 Career Solutions</text>

  <!-- Bottom Details Box -->
  <path d="M 30 310 Q 150 280 270 310 L 270 405 Q 150 405 30 405 Z" fill="#1b2a47"/>
  
  <text x="150" y="348" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffeb3b" text-anchor="middle">HAFIJUR MONDAL</text>
  <text x="150" y="372" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">SECURITY GUARD</text>
