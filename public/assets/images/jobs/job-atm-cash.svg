        <stop offset="0%" stop-color="#1e1b4b" />
        <stop offset="100%" stop-color="#9f1239" />
      </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="700" height="380" rx="16" fill="url(#posterGrad_4468)"/>
    
    <!-- Pattern Dots & Circles -->
